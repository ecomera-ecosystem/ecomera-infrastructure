services:
  vault:
    image: hashicorp/vault:1.18
    container_name: ecomera-infra-vault
    ports:
      - "8200:8200"
    volumes:
      - ./vault/config/vault-config.hcl:/vault/config/vault-config.hcl
      - ./vault/init.sh:/vault/init.sh
      - vault-data:/vault/data
      - vault-creds:/vault-creds
    environment:
      VAULT_ADDR: http://0.0.0.0:8200
      VAULT_CONFIG: /vault/config/vault-config.hcl
    cap_add:
      - IPC_LOCK
    entrypoint: |
      sh -c "
        vault server -config=/vault/config/vault-config.hcl > /tmp/vault.log 2>&1 &
        chmod +x /vault/init.sh
        exec /vault/init.sh
      "
    networks:
      - ecomera-infra-network
    healthcheck:
      test: ["CMD", "sh", "-c", "vault status >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: ecomera-infra-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecomera}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ecomera-infra-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ecomera-infra-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecomera-infra-network
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: ecomera-infra-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - ecomera-infra-network
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog
    container_name: ecomera-infra-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - ecomera-infra-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.2
    container_name: ecomera-infra-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - ecomera-infra-network

  kafka:
    image: confluentinc/cp-kafka:7.7.2
    container_name: ecomera-infra-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    networks:
      - ecomera-infra-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ecomera-infra-kafka-ui
    ports:
      - "8100:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ecomera
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
      - zookeeper
    networks:
      - ecomera-infra-network

  sonarqube-db:
    image: postgres:16-alpine
    container_name: ecomera-infra-sonar-db
    environment:
      POSTGRES_DB: sonarqube
      POSTGRES_USER: sonarqube
      POSTGRES_PASSWORD: sonarqube
    ports:
      - "5433:5432"
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    networks:
      - ecomera-infra-network
    restart: unless-stopped

  sonarqube:
    image: sonarqube:community
    container_name: ecomera-infra-sonarqube
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonarqube
      SONAR_JDBC_PASSWORD: sonarqube
    depends_on:
      - sonarqube-db
    networks:
      - ecomera-infra-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  vault-data:
  vault-creds:
  mongo_data:
  kafka_data:
  sonarqube_db_data:

networks:
  ecomera-infra-network:
    driver: bridge
