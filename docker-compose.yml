services:
  vault:
    image: hashicorp/vault:1.18
    container_name: ecomera-infra-vault
    ports:
      - "8200:8200"
    volumes:
      - ./vault/config/vault-config.hcl:/vault/config/vault-config.hcl
      - ./vault/init.sh:/vault/init.sh
      - vault-data:/vault/data
      - vault-creds:/vault-creds
    environment:
      VAULT_ADDR: http://0.0.0.0:8200
      VAULT_CONFIG: /vault/config/vault-config.hcl
    cap_add:
      - IPC_LOCK
    entrypoint: |
      sh -c "
        vault server -config=/vault/config/vault-config.hcl > /tmp/vault.log 2>&1 &
        chmod +x /vault/init.sh
        exec /vault/init.sh
      "
    networks:
      - ecomera-infra-network
    healthcheck:
      test: ["CMD", "sh", "-c", "vault status >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: ecomera-infra-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecomera}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ecomera-infra-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ecomera-infra-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecomera-infra-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  vault-data:
  vault-creds:

networks:
  ecomera-infra-network:
    driver: bridge
